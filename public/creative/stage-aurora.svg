<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Compoziție grafică originală cu reflectoare și scenă">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020C0A"/><stop offset=".48" stop-color="#06322B"/><stop offset="1" stop-color="#020507"/></linearGradient>
 <linearGradient id="beam" x1=".5" y1="0" x2=".5" y2="1"><stop stop-color="#DBFFE6" stop-opacity=".85"/><stop offset=".26" stop-color="#1BFA83" stop-opacity=".38"/><stop offset="1" stop-color="#04EC72" stop-opacity="0"/></linearGradient>
