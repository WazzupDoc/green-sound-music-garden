name: V226 Original Generated Service Art — Real Chromium Before/After
on:
  push:
    branches: [design/v226-generated-service-editorial-art]
    paths:
      - ".github/workflows/v226-service-art-visual.yml"
      - ".github/scripts/verify-v226-service-art.cjs"
      - "src/routes/servicii.tsx"
      - "src/styles/service-chapter-art-v226.css"
      - "public/media/greensound/v226-concept-*.webp"
      - "src/test/service-concept-art-v226.test.ts"
permissions:
  contents: read
jobs:
  matched-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Checkout exact V225 baseline
        run: |
          git cat-file -e e29bb677630ed98f57344be2c253fa93ae45fe03^{commit}
          git worktree add --detach /tmp/gs-v225-before e29bb677630ed98f57344be2c253fa93ae45fe03
      - name: Install before/after dependencies and browser
        run: |
          bun install --no-save
          (cd /tmp/gs-v225-before && bun install --no-save)
          npm install --prefix /tmp/gs-v226-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/gs-v226-playwright/node_modules/.bin/playwright install chromium
      - name: Serve both exact revisions independently
        run: |
          (cd /tmp/gs-v225-before && bunx vite dev --host 127.0.0.1 --port 4176 > /tmp/gs-v225.log 2>&1 &)
          (bunx vite dev --host 127.0.0.1 --port 4175 > /tmp/gs-v226.log 2>&1 &)
          for port in 4175 4176; do
            ready=0
            for i in $(seq 1 65); do
              if curl -sf "http://127.0.0.1:$port/servicii" > /dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then cat /tmp/gs-v225.log /tmp/gs-v226.log; exit 1; fi
          done
      - name: Check images HTTP/decode, truthful captions, links and matched Chromium screenshots
        run: NODE_PATH=/tmp/gs-v226-playwright/node_modules node .github/scripts/verify-v226-service-art.cjs
      - name: Upload real before/after proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-v226-services-generated-art-before-after
          path: screenshots/gs-v226-services-art/
          if-no-files-found: warn
          retention-days: 60
