name: Verify Green Sound redesign

on:
  push:
    branches:
      - design/atmospheres-in-motion-2026
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/green-sound-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: ESLint
        run: npm run lint
