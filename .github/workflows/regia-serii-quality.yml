name: Regia Serii visual and functional QA
on:
  push:
    branches:
      - design/v52-regia-serii-complete-preview
  pull_request:
    branches:
      - design/v51-regia-serii-foundation
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --no-save
      - name: Synchronize bun.lock for this preview branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/v52-regia-serii-complete-preview'
        run: |
          bun install --lockfile-only
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(regia): synchronize Bun lockfile"
            git push origin HEAD:refs/heads/design/v52-regia-serii-complete-preview
          fi
      - name: TypeScript strict
        run: bun run typecheck
      - name: SSR production build
        run: bun run build
      - name: Unit tests
        run: bun run test
      - name: Install browser
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          npm install --prefix /tmp/regia-playwright playwright@1.56.1 --no-audit --no-fund
      - name: Start local browser preview
        run: |
          (bunx vite dev --host 127.0.0.1 --port 4175 > /tmp/regia-vite.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4175/ > /dev/null || (cat /tmp/regia-vite.log && exit 1)
      - name: Browser routes + screenshots
        env:
          NODE_PATH: /tmp/regia-playwright/node_modules
        run: node .github/scripts/verify-regia.cjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regia-serii-screenshots
          path: screenshots/regia-serii
          if-no-files-found: ignore
