name: V173 Live Show Poster — matched Chromium
on:
  pull_request:
    types: [opened, synchronize]
    branches: [design/v172-event-direction-console]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --no-save
      - name: Chromium
        run: |
          npm install --prefix /tmp/gs173-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/gs173-playwright/node_modules/.bin/playwright install chromium
      - name: Capture matching baseline V172
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GS173_STAGE: before
          NODE_PATH: /tmp/gs173-playwright/node_modules
        run: |
          cp .github/scripts/v173-events-browser.cjs /tmp/v173-browser.cjs
          git checkout --detach "$BASE_SHA"
          (./node_modules/.bin/vite dev --host 127.0.0.1 --port 4175 --strictPort > /tmp/v173-before.log 2>&1 & echo $! > /tmp/v173-before.pid)
          for i in $(seq 1 60); do if curl -sf http://127.0.0.1:4175/evenimente > /dev/null; then break; fi; sleep 2; done
          NODE_PATH="$NODE_PATH" node /tmp/v173-browser.cjs
          kill "$(cat /tmp/v173-before.pid)" || true
          sleep 2
      - name: Exact-head TypeScript SSR gzip Vitest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          bun run typecheck
          bun run build
          python3 .github/scripts/check-client-budget.py
          bun run test
      - name: Six-width after, interactive and accessible
        env:
          GS173_STAGE: after
          NODE_PATH: /tmp/gs173-playwright/node_modules
        run: |
          (./node_modules/.bin/vite dev --host 127.0.0.1 --port 4175 --strictPort > /tmp/v173-after.log 2>&1 & echo $! > /tmp/v173-after.pid)
          for i in $(seq 1 60); do if curl -sf http://127.0.0.1:4175/evenimente > /dev/null; then break; fi; sleep 2; done
          NODE_PATH="$NODE_PATH" node /tmp/v173-browser.cjs
          kill "$(cat /tmp/v173-after.pid)" || true
      - name: Confirm changed screenshots at same exact viewport
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto");
          for(const w of [390,1440]){
            const hash=n=>crypto.createHash("sha256").update(fs.readFileSync("screenshots/v173/"+n+"-viewport-"+w+".png")).digest("hex");
            if(hash("before")===hash("after"))throw Error("No visual difference at "+w);
            console.log("changed screenshot",w);
          }
          NODE
      - name: Upload real Chromium before and after
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-v173-live-poster-before-after
          path: screenshots/v173/
          if-no-files-found: warn
          retention-days: 60