name: Refresh Bun lockfile for crafted React branch

on:
  push:
    branches: [design/crafted-atmospheres-react-v20]
    paths:
      - "package.json"
      - ".github/workflows/sync-crafted-lock.yml"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/crafted-atmospheres-react-v20
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install
      - name: Commit lockfile only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh bun.lock for pinned Motion and Lenis dependencies"
            git push origin HEAD:design/crafted-atmospheres-react-v20
          else
            echo "bun.lock already matches package.json"
          fi
