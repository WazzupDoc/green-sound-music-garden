name: V226 Import first-party generated editorial artwork
on:
  push:
    branches: [design/v226-generated-service-editorial-art]
    paths: [.github/workflows/v226-import-original-art.yml]
permissions:
  contents: write
jobs:
  build-visual-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download owner's ChatGPT-generated concept art, never third-party event photos
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --retry 2 --max-time 90 \
            --output /tmp/gs-v226-source.png "https://at.adobe.com/wyqtcHdNbhFMVDct"
          file /tmp/gs-v226-source.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          art=Image.open("/tmp/gs-v226-source.png")
          assert art.size==(1536,1024), f"Image must be source visual art, got {art.size}"
          assert art.format=="PNG", f"Image must be PNG, got {art.format}"
          PY
      - name: Make compact local WebP section artwork (never a real-event claim)
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          art=Image.open("/tmp/gs-v226-source.png").convert("RGB")
          dest=Path("public/media/greensound")
          dest.mkdir(parents=True,exist_ok=True)
          for name,top,bottom in [("muzica",0,335),("tehnica",342,679),("oameni",687,1024)]:
              image=art.crop((0,top,1536,bottom)).resize((1152,252),Image.Resampling.LANCZOS)
              path=dest/f"v226-concept-{name}.webp"
              image.save(path,format="WEBP",quality=74,method=6)
              assert path.stat().st_size < 85000, (path,path.stat().st_size)
              print(f"{path}: {path.stat().st_size} bytes")
          PY
      - name: Commit actual binary images to development branch (not main)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "design/v226-generated-service-editorial-art"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/greensound/v226-concept-*.webp
          git diff --cached --quiet && { echo "::error::Artwork was not staged"; exit 1; }
          git commit -m "assets(v226): add original AI concept imagery for three service chapters"
          git push origin HEAD:design/v226-generated-service-editorial-art
