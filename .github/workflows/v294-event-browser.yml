name: V294 Event editorial — matched browser evidence
on:
  push:
    branches: [design/v294-event-editorial-cue]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --no-save
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/gs294-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/gs294-playwright/node_modules/.bin/playwright install chromium
      - name: Capture baseline and exact candidate
        env:
          NODE_PATH: /tmp/gs294-playwright/node_modules
          HEAD_SHA: ${{ github.sha }}
        run: |
          cp .github/scripts/v294-event-browser.cjs /tmp/v294-event-browser.cjs
          for stage in before after; do
            if [ "$stage" = before ]; then
              git checkout --detach 3944161fd991ee5d2bbe5052b93371f78dd900e2
            else
              git checkout --detach "$HEAD_SHA"
            fi
            ./node_modules/.bin/vite dev --host 127.0.0.1 --port 4175 --strictPort > "/tmp/v294-$stage.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            ready=0
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:4175/evenimente/nunti >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then cat "/tmp/v294-$stage.log"; exit 1; fi
            GS294_STAGE="$stage" node /tmp/v294-event-browser.cjs
            kill "$pid" || true
            wait "$pid" || true
            trap - EXIT
          done
          for width in 390 1440; do
            if cmp -s "screenshots/v294/before-hero-$width.png" "screenshots/v294/after-hero-$width.png"; then
              echo "No screenshot change at $width"; exit 1
            fi
          done
      - name: Upload actual Chromium captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-sound-v294-event-before-after
          path: screenshots/v294/
          if-no-files-found: warn
          retention-days: 60
