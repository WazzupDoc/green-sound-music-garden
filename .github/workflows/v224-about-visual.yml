name: V224 About Editorial Score — matched Chromium
on:
  push:
    branches: [design/v224-about-production-score]
permissions:
  contents: read
jobs:
  visual-about:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Checkout exact validated V223 baseline
        run: |
          git cat-file -e 747cb643d7f087a1b65c58746480c3a4c48ba7e3^{commit}
          git worktree add --detach /tmp/gs-v223-before 747cb643d7f087a1b65c58746480c3a4c48ba7e3
      - name: Install site and screenshot dependencies
        run: |
          bun install --no-save
          (cd /tmp/gs-v223-before && bun install --no-save)
          npm install --prefix /tmp/gs-v224-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/gs-v224-playwright/node_modules/.bin/playwright install chromium
      - name: Start before and after preview servers
        run: |
          (cd /tmp/gs-v223-before && bunx vite dev --host 127.0.0.1 --port 4176 > /tmp/gs-v223.log 2>&1 &)
          (bunx vite dev --host 127.0.0.1 --port 4175 > /tmp/gs-v224.log 2>&1 &)
          for port in 4175 4176; do
            ready=0
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:$port/despre-noi" > /dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then cat /tmp/gs-v223.log /tmp/gs-v224.log; exit 1; fi
          done
      - name: Verify real DOM/images/landmark and matched screenshots at six widths
        run: NODE_PATH=/tmp/gs-v224-playwright/node_modules node .github/scripts/verify-v224-about-browser.cjs
      - name: Upload matched images including full-motion hover
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-v224-about-before-after-chromium
          path: screenshots/gs-v224-about-score/
          if-no-files-found: warn
          retention-days: 60
