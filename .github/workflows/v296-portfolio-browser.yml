name: V296 Portfolio Contact Sheet — matched browser evidence
on:
  push:
    branches: [design/v296-portfolio-contact-sheet]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --no-save
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/gs296-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/gs296-playwright/node_modules/.bin/playwright install chromium
      - name: Capture baseline and exact candidate
        env:
          NODE_PATH: /tmp/gs296-playwright/node_modules
          HEAD_SHA: ${{ github.sha }}
        run: |
          cp .github/scripts/v296-portfolio-browser.cjs /tmp/v296-portfolio-browser.cjs
          for stage in before after; do
            if [ "$stage" = before ]; then
              git checkout --detach 972002afac6ab99f7295524c77e7ce4d7f5c126e
            else
              git checkout --detach "$HEAD_SHA"
            fi
            ./node_modules/.bin/vite dev --host 127.0.0.1 --port 4175 --strictPort > "/tmp/v296-$stage.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            ready=0
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:4175/ >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then cat "/tmp/v296-$stage.log"; exit 1; fi
            GS296_STAGE="$stage" node /tmp/v296-portfolio-browser.cjs
            kill "$pid" || true
            wait "$pid" || true
            trap - EXIT
          done
          for width in 390 1440; do
            if cmp -s "screenshots/v296/before-viewer-$width.png" "screenshots/v296/after-viewer-$width.png"; then
              echo "No visual viewer change at $width"; exit 1
            fi
          done
      - name: Upload matched Chromium captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-sound-v296-portfolio-contact-sheet
          path: screenshots/v296/
          if-no-files-found: warn
          retention-days: 60
