name: Verify Green Sound Sillage prototype

on:
  push:
    branches:
      - design/green-sound-sillage-open-source
  pull_request:
    paths:
      - "public/greensound-prototype/**"
      - ".github/workflows/verify-gs-prototype.yml"

permissions:
  contents: read

jobs:
  static-and-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate licensed template adaption and custom script syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h = Path("public/greensound-prototype/index.html").read_text()
          assert h.count('class="works__card"') == 8, "Expected 8 cards for original animation"
          assert h.count('class="crew__card"') == 6, "Expected 6 cards for original animation"
          assert h.count('class="method__frame"') == 4, "Expected 4 stage frames"
          assert 'Green Sound Music' in h and 'Sillage' not in h
          assert 'data-8b-placeholder' not in h and 'images.unsplash.com' not in h
          assert '<dialog' in h and 'gs-lights-button' in h
          assert Path("public/greensound-prototype/LICENSE-8B.txt").exists()
          js = re.search(r'<script id="gs-ui">([\s\S]*?)</script>',h)
          assert js is not None
          Path("/tmp/gs-ux.js").write_text(js.group(1))
          print("Verified template structure, branding, demo data removal, license and controls")
          PY
          node --check /tmp/gs-ux.js
      - name: Install chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Serve the actual standalone prototype
        run: |
          (python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/gs-http.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/greensound-prototype/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/greensound-prototype/index.html >/dev/null
      - name: Take actual desktop and mobile snapshots
        run: |
          mkdir -p screenshots
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=2500 http://127.0.0.1:4173/greensound-prototype/index.html screenshots/green-sound-desktop.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=2500 http://127.0.0.1:4173/greensound-prototype/index.html screenshots/green-sound-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-sound-sillage-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
